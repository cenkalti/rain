version: 2
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod download
builds:
  - env:
    - CGO_ENABLED=0
    ldflags:
    - -s -w -X github.com/cenkalti/rain/v2/torrent.Version={{.Version}}
    goos:
    - linux
    - darwin
    - windows
    goarch:
    - amd64
    - arm64
    ignore:
    - goos: linux
      goarch: arm64
    - goos: windows
      goarch: arm64
universal_binaries:
  # Merge the darwin amd64 and arm64 builds into one binary, so a single
  # macOS archive with the same name as before runs natively on Intel and
  # Apple Silicon Macs.
  - replace: true
archives:
  - format: tar.gz
    name_template: >-
      {{- .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
brews:
  - repository:
      owner: cenkalti
      name: homebrew-rain
    directory: Formula
    homepage:  https://github.com/cenkalti/rain
    description: BitTorrent client
    install: |
      bin.install "rain"
      output = Utils.popen_read("#{bin}/rain bash-autocomplete")
      (bash_completion/"rain").write output
      prefix.install_metafiles
    test: |
      system "#{bin}/rain --version"
