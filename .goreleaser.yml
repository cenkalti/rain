version: 2
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod download
builds:
  - env:
    - CGO_ENABLED=0
    ldflags:
    - -s -w -X github.com/cenkalti/rain/v2/torrent.Version={{.Version}}
    goos:
    - linux
    - darwin
    - windows
    goarch:
    - amd64
    - arm64
    ignore:
    - goos: linux
      goarch: arm64
    - goos: windows
      goarch: arm64
universal_binaries:
  # Merge the darwin amd64 and arm64 builds into one binary, so a single
  # macOS archive with the same name as before runs natively on Intel and
  # Apple Silicon Macs.
  - replace: true
archives:
  - formats: [tar.gz]
    name_template: >-
      {{- .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
homebrew_casks:
  - repository:
      owner: cenkalti
      name: homebrew-rain
    homepage: https://github.com/cenkalti/rain
    description: BitTorrent client
    generate_completions_from_executable:
      args:
        - bash-autocomplete
      shell_parameter_format: none
      shells:
        - bash
    hooks:
      post:
        # The merged universal binary is unsigned, and casks are quarantined on download.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rain"]
          end
